defaults:
  - ppo_trainer
  - _self_
hydra:
  searchpath:
    - pkg://verl.trainer.config
algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  norm_adv_by_std_in_grpo: true
data:
  train_files: null
  val_files: null
  train_batch_size: 4
  max_prompt_length: 4096
  max_response_length: 4096
  truncation: error
  filter_overlong_prompts: false
  image_key: images
  return_raw_chat: true
  apply_chat_template_kwargs:
    enable_thinking: false
actor_rollout_ref:
  model:
    path: /home/ubuntu/models/Qwen3.5-9B
    use_remove_padding: false
    enable_gradient_checkpointing: true
  actor:
    strategy: fsdp2
    ppo_mini_batch_size: 4
    ppo_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: false
    use_kl_loss: true
    kl_loss_coef: 0.01
    kl_loss_type: low_var_kl
    entropy_coeff: 0
    optim:
      lr: 1.0e-6
    fsdp_config:
      model_dtype: bfloat16
      param_offload: true
      optimizer_offload: true
      use_torch_compile: false
  ref:
    strategy: fsdp2
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: true
      use_torch_compile: false
  rollout:
    name: vllm
    n: 4
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.35
    log_prob_micro_batch_size_per_gpu: 1
    max_model_len: 8192
    max_num_batched_tokens: 8192
    multi_turn:
      enable: false
    agent:
      default_agent_loop: single_turn_agent
reward:
  num_workers: 1
  custom_reward_function:
    path: rl/reward.py
    name: compute_score
    reward_kwargs:
      blender: /home/ubuntu/.local/bin/blender
      timeout: 60
      samples: 4096
      seed: 42
      work_dir: temp/reward
trainer:
  project_name: 3DCodePerception
  experiment_name: single_response_grpo
  logger: [console]
  nnodes: 1
  n_gpus_per_node: 2
  total_epochs: 1
  save_freq: 10
  test_freq: 10
  val_before_train: true
  default_local_dir: outputs/single_response_grpo
ray_kwargs:
  ray_init:
    runtime_env:
      py_executable: null
