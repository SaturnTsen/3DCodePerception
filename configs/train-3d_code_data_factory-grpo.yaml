defaults:
  - ppo_trainer
  - _self_
hydra:
  searchpath:
    - pkg://verl.trainer.config
  # rl/train.py tees the whole stdout/stderr into train.log; drop Hydra's file handler to avoid duplicates.
  job_logging:
    root:
      handlers: [console]
algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  norm_adv_by_std_in_grpo: true
data:
  train_files: data/3DCodeDataFactory_train.parquet
  val_files: data/3DCodeDataFactory_val.parquet
  train_batch_size: 4
  max_prompt_length: 4096
  max_response_length: 4096
  truncation: error
  filter_overlong_prompts: false
  image_key: images
  return_raw_chat: true
  apply_chat_template_kwargs:
    enable_thinking: false
actor_rollout_ref:
  model:
    path: /home/ubuntu/models/Qwen3.8-27B
    use_remove_padding: false
    enable_gradient_checkpointing: true
    # flash-attn has no prebuilt wheel for torch 2.13 + CUDA 13; use PyTorch SDPA.
    override_config:
      attn_implementation: sdpa
  actor:
    strategy: fsdp2
    ppo_mini_batch_size: 4
    ppo_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: false
    use_kl_loss: true
    kl_loss_coef: 0.01
    kl_loss_type: low_var_kl
    entropy_coeff: 0
    # Compute entropy over the 248k-vocab logits in chunks instead of one full fp32 copy per micro-batch.
    entropy_from_logits_with_chunking: true
    optim:
      lr: 1.0e-6
    fsdp_config:
      model_dtype: bfloat16
      param_offload: true
      optimizer_offload: true
      use_torch_compile: false
  ref:
    strategy: fsdp2
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: true
      use_torch_compile: false
  rollout:
    name: vllm
    n: 4
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    tensor_model_parallel_size: 4
    # Weights take ~13.5 GiB per GPU at TP=4; only 16 of 64 layers keep a KV cache, so 16 x 8192 tokens
    # need only a few GiB. 0.4 leaves ample KV space while returning ~19 GiB per GPU.
    gpu_memory_utilization: 0.4
    log_prob_micro_batch_size_per_gpu: 1
    max_model_len: 8192
    max_num_batched_tokens: 8192
    multi_turn:
      enable: false
    agent:
      default_agent_loop: single_turn_agent
reward:
  num_workers: 1
  custom_reward_function:
    path: rl/reward.py
    name: compute_score
    reward_kwargs:
      # Set by rl/train.py at start: <trainer.experiment_name>-<start time>.
      run_id: ???
      # Reward service on gbc1 (reward), reached through TCP port forwarding.
      service_url: http://127.0.0.1:8720
      request_timeout: 3600
      chamfer_normalization: rms_radius
      # Placeholders until the component distributions of the initial model are measured
      # (docs/TODOs.md). Replace before real training.
      chamfer_temperature: 1.0
      weight_chamfer: 0.25
      weight_dinov3: 0.25
      weight_uni3d: 0.25
      weight_uni3d_image: 0.25
trainer:
  use_v1: true
  v1:
    trainer_mode: sync  # 可选：sync / colocate_async / separate_async
  project_name: rl
  experiment_name: single_response_grpo
  logger: [console, wandb]
  nnodes: 1
  n_gpus_per_node: 4
  total_epochs: 1
  save_freq: 10
  test_freq: 10
  val_before_train: false
  resume_mode: auto
  default_local_dir: outputs/single_response_grpo
ray_kwargs:
  ray_init:
    runtime_env:
      py_executable: null
      env_vars:
        # verl reads the wandb entity only from this variable inside the Ray TaskRunner.
        WANDB_ENTITY: lingada60-institut-polytechnique-de-paris
