[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "3dcodeperception"
version = "0.1.0"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["rl*", "reward*"]

[tool.pyright]
include = ["rl", "reward", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = ".pixi/envs"
venv = "default"
